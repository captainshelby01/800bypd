    <text x="120" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#1E1B4B">APPLE</text>
    <circle cx="120" cy="180" r="30" fill="#EF4444"/>
    <path d="M120 150 Q125 140 135 145" stroke="#15803D" stroke-width="4" fill="none"/>
