      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" rx="30" fill="url(#bg4)"/>
  <rect x="15" y="15" width="570" height="720" rx="20" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>
  
  <rect x="180" y="55" width="240" height="36" rx="18" fill="#FDE047"/>
  <text x="300" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#312E81" letter-spacing="1.5">EARLY MASTERY FLASHCARDS</text>
  
