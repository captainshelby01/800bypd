  <text x="300" y="225" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="44" fill="#FDE047">NUMBERS</text>
  <text x="300" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#E0E7FF">Pocket &amp; Big Sizes • 20 Durable Learning Cards</text>
  
  <!-- Flashcards Display Deck -->
  <g transform="translate(160, 300)">
    <!-- Back card 1 -->
    <rect x="50" y="10" width="170" height="230" rx="20" fill="#FBCFE8" stroke="#F472B6" stroke-width="3" transform="rotate(15 135 125)"/>
    <!-- Back card 2 -->
    <rect x="-10" y="20" width="170" height="230" rx="20" fill="#FEF08A" stroke="#FACC15" stroke-width="3" transform="rotate(-15 75 135)"/>
