<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" rx="30" fill="url(#bg2)"/>
  <rect x="15" y="15" width="570" height="720" rx="20" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>
  
  <!-- Golden Cross & Constellation -->
  <g stroke="#BAE6FD" stroke-width="1.5" opacity="0.7">
    <line x1="140" y1="120" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="310" y2="130"/>
    <line x1="310" y1="130" x2="380" y2="190"/>
    <line x1="380" y1="190" x2="480" y2="150"/>
  </g>
  
  <rect x="175" y="55" width="250" height="36" rx="18" fill="#38BDF8"/>
  <text x="300" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#0F172A" letter-spacing="1.5">WONDER &amp; PRAYER SERIES</text>
  
  <!-- Title -->
  <text x="300" y="165" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF">The Boy Who</text>
  <text x="300" y="215" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="44" fill="#38BDF8">SPOKE TO THE STARS</text>
  <text x="300" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#93C5FD">Discovering God's Greatness in Every Star</text>
  
  <!-- Telescope & Child Silhouette -->
  <g transform="translate(180, 280)">
    <circle cx="120" cy="140" r="110" fill="#0284C7" opacity="0.2"/>
    <circle cx="120" cy="140" r="70" fill="#38BDF8" opacity="0.3"/>
    <!-- Telescope -->
    <line x1="60" y1="180" x2="180" y2="90" stroke="#FACC15" stroke-width="14" stroke-linecap="round"/>
    <line x1="180" y1="90" x2="210" y2="70" stroke="#FBBF24" stroke-width="18" stroke-linecap="round"/>
    <line x1="110" y1="140" x2="70" y2="240" stroke="#94A3B8" stroke-width="6"/>
    <line x1="130" y1="140" x2="160" y2="240" stroke="#94A3B8" stroke-width="6"/>
    <line x1="120" y1="140" x2="115" y2="240" stroke="#64748B" stroke-width="6"/>
  </g>
  
  <!-- Scripture Tag -->
  <rect x="90" y="580" width="420" height="48" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="300" y="608" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#E0F2FE">"He determines the number of stars and calls them by name."</text>
  <text x="300" y="622" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#38BDF8">— PSALM 147:4</text>
  
  <!-- Bottom Bar -->
  <rect x="0" y="660" width="600" height="90" fill="#0B1329"/>
  <text x="300" y="700" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">Written by PD</text>
  <text x="300" y="722" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#64748B">800BYPD CHILDREN'S EDITIONS</text>
</svg>