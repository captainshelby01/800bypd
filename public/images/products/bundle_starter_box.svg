<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="40%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" rx="30" fill="url(#bg5)"/>
  <rect x="15" y="15" width="570" height="720" rx="20" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="10 5" opacity="0.6"/>
  
  <rect x="160" y="55" width="280" height="36" rx="18" fill="#FACC15"/>
  <text x="300" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#312E81" letter-spacing="1.5">COMPLETE 5-ITEM SET</text>
  
  <text x="300" y="165" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="34" fill="#FFFFFF">Starter Learning</text>
  <text x="300" y="215" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="44" fill="#FACC15">FAITH BOX</text>
  <text x="300" y="250" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#FBCFE8">2 Puzzles + 1 Colouring Book + 1 Flashcard + 1 Storybook</text>
  
  <!-- Composite Box Graphic -->
  <g transform="translate(130, 270)">
    <!-- Box Container 3D -->
    <path d="M40 180 L170 120 L300 180 L170 240 Z" fill="#FACC15"/>
    <path d="M40 180 L170 240 L170 320 L40 260 Z" fill="#EAB308"/>
    <path d="M170 240 L300 180 L300 260 L170 320 Z" fill="#CA8A04"/>
    
    <!-- Items popping out -->
    <!-- Puzzle 1 -->
    <rect x="30" y="50" width="110" height="140" rx="12" fill="#FDE047" stroke="#312E81" stroke-width="3" transform="rotate(-15 85 120)"/>
    <text x="85" y="125" text-anchor="middle" font-family="'Fredoka', cursive" font-size="13" font-weight="700" fill="#312E81" transform="rotate(-15 85 120)">PUZZLE</text>
    
    <!-- Colouring Book -->
    <rect x="100" y="20" width="120" height="150" rx="12" fill="#F472B6" stroke="#831843" stroke-width="3"/>
    <text x="160" y="100" text-anchor="middle" font-family="'Fredoka', cursive" font-size="13" font-weight="700" fill="#FFFFFF">COLOURING</text>
    
    <!-- Flashcard -->
    <rect x="180" y="50" width="100" height="130" rx="12" fill="#818CF8" stroke="#312E81" stroke-width="3" transform="rotate(15 230 115)"/>
    <text x="230" y="120" text-anchor="middle" font-family="'Fredoka', cursive" font-size="12" font-weight="700" fill="#FFFFFF" transform="rotate(15 230 115)">CARDS</text>
    
    <!-- Ribbon -->
    <path d="M170 120 L170 320" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M40 220 L300 220" stroke="#FFFFFF" stroke-width="8"/>
  </g>
  
  <rect x="80" y="600" width="440" height="42" rx="21" fill="#1E1B4B"/>
  <text x="300" y="626" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#FACC15">Best For: Toddlers &amp; Early Learners (Ages 2–6)</text>
  
  <rect x="0" y="660" width="600" height="90" fill="#180C2E"/>
  <text x="300" y="700" text-anchor="middle" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">Curated by PD</text>
  <text x="300" y="722" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#E879F9">1-CLICK INSTANT CHECKOUT</text>
</svg>